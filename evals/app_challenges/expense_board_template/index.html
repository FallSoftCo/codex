<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Board</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Team Finance</p>
          <h1>Expense Board</h1>
          <p class="subtitle">Track team expenses, reimbursement state, and export a quick ledger snapshot.</p>
        </div>
        <button id="exportButton" type="button">Export Summary</button>
      </header>

      <section class="summary-grid" aria-label="Expense summary">
        <article class="summary-card">
          <span>Total Expenses</span>
          <strong id="summaryTotal">0</strong>
        </article>
        <article class="summary-card">
          <span>Total Amount</span>
          <strong id="summaryAmount">$0.00</strong>
        </article>
        <article class="summary-card">
          <span>Outstanding</span>
          <strong id="summaryOutstanding">$0.00</strong>
        </article>
      </section>

      <section class="panel">
        <h2>Add Expense</h2>
        <form id="expenseForm" class="data-form">
          <label>
            Label
            <input id="expenseLabel" name="expenseLabel" type="text" required />
          </label>
          <label>
            Category
            <input id="expenseCategory" name="expenseCategory" type="text" required />
          </label>
          <label>
            Amount
            <input id="expenseAmount" name="expenseAmount" type="number" min="0.01" step="0.01" required />
          </label>
          <button type="submit">Add Expense</button>
        </form>
      </section>

      <section class="panel">
        <div class="filters">
          <label>
            Category
            <select id="filterCategory">
              <option value="all">All categories</option>
            </select>
          </label>
          <label>
            Status
            <select id="filterStatus">
              <option value="all">All statuses</option>
              <option value="outstanding">Outstanding</option>
              <option value="reimbursed">Reimbursed</option>
            </select>
          </label>
        </div>
        <p id="emptyState" class="empty-state">No expenses yet. Add one to get started.</p>
        <div id="expenseList" class="card-list" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2>Export Output</h2>
        <pre id="exportOutput" class="export-output">{}</pre>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
