name: Maintainer Agent - Issues

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  engage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Draft maintainer reply
        id: codex
        if: ${{ secrets.CODEX_OPENAI_API_KEY != '' }}
        uses: openai/codex-action@main
        with:
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          allow-users: "*"
          prompt: |
            You are the maintainer agent for the public losangelex repository.

            Write one concise GitHub issue reply.

            Goals:
            - Be technical, polite, and specific.
            - Ask for reproducible steps if details are missing.
            - Ask for expected behavior, actual behavior, environment, and logs when relevant.
            - Redirect open-ended product ideas toward GitHub Discussions when that would help.
            - Do not claim a fix exists unless the issue text itself links one.
            - If the report appears security-sensitive, direct the reporter to security@openai.com instead of discussing exploit details in public.

            Event: ${{ github.event_name }}
            Action: ${{ github.event.action }}

            Issue title:
            ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Latest comment body:
            ${{ github.event.comment.body }}
          output-schema: |
            {
              "type": "object",
              "properties": {
                "comment": { "type": "string" }
              },
              "required": ["comment"],
              "additionalProperties": false
            }

      - name: Post maintainer reply
        uses: actions/github-script@v7
        env:
          CODEX_OUTPUT: ${{ steps.codex.outputs.final-message }}
        with:
          script: |
            const repo = context.repo;
            const issue = context.payload.issue;
            if (!issue) return;

            const title = issue.title || "";
            const body = issue.body || "";
            const lower = `${title}\n${body}`.toLowerCase();

            const securitySensitive = /\bsecurity|vulnerability|token|secret|credential|auth bypass|rce\b/.test(lower);
            const hasSteps = /\bsteps? to reproduce\b/i.test(body) || /\brepro\b/i.test(body);
            const hasExpected = /\bexpected\b/i.test(body);
            const hasActual = /\bactual\b/i.test(body) || /\bobserved\b/i.test(body);
            const needsRepro = /\bbug|error|crash|broken|fail|regression\b/.test(lower) && !(hasSteps && hasExpected && hasActual);
            const questionLike = /\bhow|why|question|help|usage|docs?\b/.test(lower);

            let comment = null;
            const raw = (process.env.CODEX_OUTPUT || "").replace(/\r/g, "");
            if (raw) {
              try {
                const parsed = JSON.parse(raw);
                if (typeof parsed.comment === "string" && parsed.comment.trim()) {
                  comment = parsed.comment.trim();
                }
              } catch {}
            }

            if (!comment) {
              if (securitySensitive) {
                comment = [
                  "Thanks for the report.",
                  "If this may involve a vulnerability, leaked secret, or another security-sensitive issue, please email security@openai.com instead of posting additional exploit details here.",
                ].join("\n\n");
              } else if (needsRepro) {
                comment = [
                  "Thanks for the report. To make this actionable, please add:",
                  "- exact repro steps",
                  "- expected behavior",
                  "- actual behavior",
                  "- environment details such as OS, shell, install method, and model/provider setup",
                  "- relevant logs or screenshots",
                ].join("\n");
              } else if (questionLike) {
                comment = [
                  "Thanks for the question.",
                  "If this turns into broader product or workflow discussion, GitHub Discussions is the best place for that thread. For a bug, please include a minimal repro and environment details.",
                ].join("\n\n");
              } else {
                comment = [
                  "Thanks for the report.",
                  "Maintainer review is active. If you can add a minimal repro, expected behavior, actual behavior, and environment details, that will make validation faster.",
                ].join("\n\n");
              }
            }

            await github.rest.issues.createComment({
              ...repo,
              issue_number: issue.number,
              body: comment,
            });
